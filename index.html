<!DOCTYPE html>
<html lang="zh"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Sourcing Trip · Look spec</title>
<link rel="stylesheet" href="lab.css"/>
<style>
html{scroll-behavior:smooth;scroll-snap-type:y proximity}
body{background:#fff}
.top{position:fixed;left:0;right:0;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--hair);display:flex;align-items:center;gap:18px;padding:12px 32px}
.top img{height:16px}
.top .ttl{font-size:13px;font-weight:600;color:var(--ink)}
.top nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.top nav a{font-size:12px;color:var(--se);padding:5px 10px;border-radius:999px;font-variant-numeric:tabular-nums}
.top nav a.on{background:var(--rose);color:#fff}
section.sl{min-height:100vh;padding:84px 48px 56px;border-top:1px solid var(--div);scroll-snap-align:start;max-width:1500px;margin:0 auto}
.slh{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.slh .no{font-size:13px;font-weight:600;color:var(--rose);letter-spacing:.06em}
.slh h2{margin:0}
.dec{font-size:14.5px;color:var(--mu);line-height:1.7;max-width:980px;margin-bottom:22px}
body[data-lang=zh] .dec,body[data-lang=zh] td,body[data-lang=zh] .rules span{line-height:1.8}
.grid{display:flex;flex-direction:column;gap:26px}
.stk{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;align-items:start}.stk.one{grid-template-columns:minmax(0,1fr);max-width:960px}
.lbl{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12px;font-weight:600;color:var(--lab);letter-spacing:.05em;text-transform:uppercase}
.lbl .sp{flex:1}
.lbl button{font-size:11.5px;font-weight:500;color:var(--se);background:#fff;border:1px solid var(--hair);border-radius:999px;padding:3px 11px;text-transform:none;letter-spacing:0;font-family:inherit;cursor:pointer}
.lbl button:hover{background:var(--card);color:var(--ink)}
.ref{width:100%;border-radius:10px;display:block}
table.spec{width:100%;border-collapse:collapse;font-size:12.5px}
table.spec th{text-align:left;font-size:11px;font-weight:600;color:var(--lab);letter-spacing:.05em;text-transform:uppercase;padding:0 8px 8px 0;border-bottom:1px solid var(--hair)}
table.spec td{padding:9px 8px 9px 0;border-bottom:1px solid var(--div);vertical-align:top;color:var(--li);line-height:1.5}
table.spec td:first-child{font-weight:600;color:var(--ink);white-space:nowrap;width:120px}
table.spec td:last-child{width:42%}
table.spec td.v{font-variant-numeric:tabular-nums;white-space:nowrap}
table.spec tr.grp td{font-size:11px;font-weight:600;color:var(--rose);letter-spacing:.06em;text-transform:uppercase;padding-top:16px;border-bottom:1px solid var(--hair)}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;border:1px solid var(--hair);vertical-align:-1px;margin-right:6px}
.note{margin-top:14px;font-size:12.5px;color:var(--se);line-height:1.6;border-left:2px solid var(--rose);padding-left:12px}
.cover h1{font-size:clamp(34px,4.4vw,58px);font-weight:700;letter-spacing:-1.6px;line-height:1.05;margin:10px 0 14px}
body[data-lang=zh] .cover h1{letter-spacing:normal;line-height:1.25}
.cover .ey{font-size:12.5px;font-weight:600;color:var(--rose);letter-spacing:.07em}
.pal{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 26px}
.pal div{width:132px}
.pal i{display:block;height:54px;border-radius:8px;border:1px solid var(--hair)}
.pal b{display:block;font-size:12px;font-weight:600;margin-top:7px}
.pal span{font-size:11.5px;color:var(--se)}
.rules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 28px;max-width:1100px}
.rules div{border-top:1px solid var(--div);padding-top:10px}
.rules b{display:block;font-size:13px;font-weight:600;margin-bottom:3px}
.rules span{font-size:13px;color:var(--mu);line-height:1.6}
.fonts{display:flex;gap:28px;flex-wrap:wrap;margin:6px 0 26px}
.fonts div b{display:block;font-size:22px;font-weight:700}
.fonts div span{font-size:12px;color:var(--se)}
.cnf{font-family:"Alibaba PuHuiTi",sans-serif}
/* title: coach window */
.tCW .ph{background-image:url(frames/coach_window.jpg);background-size:112% auto;background-position:0% 50%;animation:cwpan 10s linear infinite alternate}
@keyframes cwpan{to{background-position:100% 50%}}
.tCW .tint{position:absolute;inset:0;background:linear-gradient(90deg,rgba(19,0,45,.45),rgba(19,0,45,0) 60%)}
.tCW .tt{position:absolute;left:10%;top:34%}
.tCW h5{font-size:5.85cqw;font-weight:800;line-height:.94;letter-spacing:-.06cqw;text-transform:uppercase;color:rgba(255,255,255,.94)}
.tCW p{font-size:1.55cqw;font-weight:600;margin-top:1.15cqw;line-height:1.3}
.tCW .lg{right:4cqw;bottom:3.75cqw;height:1.9cqw}
.tCW.go h5{animation:cwIn .6s .4s ease-out both}@keyframes cwIn{from{opacity:0;filter:blur(.6cqw)}}
.tCW.go p{animation:rise .4s .9s ease-out both}.tCW.go .lg{animation:fade .4s 1.2s both}
/* caption: slate corner */
.B6 .sc .scrim{background:linear-gradient(to top,rgba(19,0,45,.55),rgba(19,0,45,0) 40%)}
.B6 .el{position:absolute;left:5cqw;bottom:5cqw;padding:1.4cqw 0 0 1.7cqw;color:#fff}
.B6 .br{position:absolute;left:0;top:0;width:2.3cqw;height:100%;border-left:.104cqw solid #fff;border-top:.104cqw solid #fff}
.B6 b{display:flex;gap:.6cqw;align-items:center;font-size:3.6cqw;font-weight:700;line-height:1.1;letter-spacing:-.025cqw}
.B6 b.x{font-size:6.5cqw;font-weight:800;line-height:1;letter-spacing:-.1cqw}
.B6 span{display:block;font-size:1.8cqw;font-weight:400;opacity:.9;margin-top:.4cqw;line-height:1.35}
.B6 small{display:block;font-size:1.15cqw;font-weight:600;letter-spacing:.16cqw;text-transform:uppercase;color:#FF0051;margin-top:.8cqw}
.B6 .fl{width:2.9cqw;height:2.9cqw;border-width:.104cqw}
.B6 .fls{gap:.7cqw}
.B6 .sc.on .br{animation:brIn .25s ease-out both}@keyframes brIn{from{clip-path:inset(0 100% 100% 0)}}
.B6 .sc.on .el>*:not(.br){animation:rise .35s ease-out both}
.B6 .sc.on .el>*:nth-child(3){animation-delay:.08s}.B6 .sc.on .el>*:nth-child(4){animation-delay:.16s}
/* subtitles: two languages */
.S2B .sub{bottom:4.4cqw}
.S2B .l{display:block;line-height:1.85}
.S2B .en{font-size:2cqw;font-weight:500}
.S2B .zh{font-family:'Alibaba PuHuiTi',sans-serif;font-size:1.46cqw;font-weight:400;line-height:1.75;margin-top:.3cqw;letter-spacing:.03cqw}
.S2B .l span{background:rgba(19,0,45,.86);padding:.3cqw .9cqw;border-radius:.4cqw;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.S2B .zh span{color:rgba(255,255,255,.85);padding:.22cqw .75cqw}
/* light day counter */
.hudN.lt{color:#1F2323}.hudN.lt span{color:#484F56;opacity:1}
.days.lt div{color:rgba(31,35,35,.45)}.days.lt div.on{color:#1F2323}.days.lt div i{background:rgba(31,35,35,.12)}
@media (max-width:1100px){.stk{grid-template-columns:1fr}table.spec{font-size:11.5px}.top nav{display:none}section.sl{padding:72px 16px 40px}.rules{grid-template-columns:1fr}}
</style>
<script>window.LAB_NO_BUILD=1;</script>
<script src="map.js"></script>
<script src="higgsfield/manifest.js"></script>
<script src="lab.js"></script>
</head>
<body data-lang="zh">
<div class="top"><img src="wf/wf_logo_en_hrz_pos.svg" alt="WorldFirst"/><span class="ttl">Sourcing Trip</span><nav id="dnav"></nav><button class="btn" id="bLangD">English</button></div>
<main id="deck"></main>
<script>
(function(){
const Z=(en,zh)=>LANG==='zh'?zh:en;
const P=(n,c)=>`<span class="sw" style="background:${c}"></span>`;
const SLIDES=[];
const rows=(r)=>`<table class="spec"><tr><th>${Z('Element','元素')}</th><th>${Z('Font','字体')}</th><th>${Z('Size','字号')}</th><th>${Z('Weight','字重')}</th><th>${Z('Spacing','行高 / 字距')}</th><th>${Z('Colour','颜色')}</th><th>${Z('Position and notes','位置与说明')}</th></tr>${r.map(x=>x.g?`<tr class="grp"><td colspan="7">${Z(x.g[0],x.g[1])}</td></tr>`:`<tr><td>${Z(x[0],x[1])}</td><td>${x[2]}</td><td class="v">${x[3]}</td><td class="v">${x[4]}</td><td class="v">${Z(x[5],x['5z']||x[5])}</td><td class="v">${x[6]}</td><td>${Z(x[7],x[8])}</td></tr>`).join('')}</table>`;
const R=(a,b,font,size,wt,sp,col,en,zh,spz)=>{const o=[a,b,font,size,wt,sp,col,en,zh];o['5z']=spz;return o};
const W='#FFFFFF',RED='#FF0051',INK='#1F2323';
const col=(c,a)=>`${P(0,c)}${c}${a?' '+a:''}`;
const stageLbl=(en,zh,rp)=>`<div class="lbl">${Z(en,zh)}<span class="sp"></span>${rp?`<button data-rp>${Z('Replay','重播')}</button>`:''}</div>`;

/* ---------- 00 cover ---------- */
const cover=()=>`<section class="sl cover" id="d0"><div class="ey">SOURCING TRIP DIARIES · TOUR 1 · ${Z('LOOK AND GRAPHICS SPEC','画面与图形规范')}</div>
 <h1>Sourcing Trip<br/>${Z('Graphics for the revision','修改版图形方案')}</h1>
 <p class="dec">${Z('The five looks picked for the revision: title card, caption system, subtitles, the route map ground and the map motion. Every slide shows the look working on real trip footage and lists every text overlay with its font, size, weight, spacing, colour and position. All values are for the 1920 × 1080 master; scale them in proportion for other sizes.','这次修改版选定的五项画面：片名卡、字幕系统、对白字幕、路线地图底图、地图动效。每一页都用这趟行程的真实画面演示效果，并列出每个屏幕文字元素的字体、字号、字重、间距、颜色和位置。所有数值以 1920 × 1080 母版为准，其他尺寸按比例缩放。')}</p>
 <h3 class="k">${Z('Fonts','字体')}</h3>
 <div class="fonts"><div><b>Poppins</b><span>${Z('English. ExtraBold 800, Bold 700, SemiBold 600, Medium 500, Regular 400. Google Fonts.','英文。ExtraBold 800、Bold 700、SemiBold 600、Medium 500、Regular 400。Google Fonts 可下载。')}</span></div><div><b class="cnf">阿里巴巴普惠体</b><span>${Z('Chinese. Regular 400 and Bold 700 only, never heavier.','中文。只用 Regular 400 和 Bold 700，不用更粗的字重。')}</span></div></div>
 <h3 class="k">${Z('Colours','颜色')}</h3>
 <div class="pal">${[['WF Red','#FF0051','万里汇红'],['Dark Purple','#13002D','深紫'],['Purple','#32006E','紫'],['Black','#1F2323','黑'],['Grey','#484F56','灰'],['Light Grey','#ECEDEE','浅灰'],['White','#FFFFFF','白']].map(c=>`<div><i style="background:${c[1]}"></i><b>${Z(c[0],c[2])}</b><span>${c[1]}</span></div>`).join('')}</div>
 <h3 class="k">${Z('Rules for every element','所有元素的规则')}</h3>
 <div class="rules">${[['One at a time','同一时间只一个','Never more than one graphic element on screen, never over a face.','画面上最多一个图形元素，不压人脸。'],
  ['Motion','动效','In over 250 to 600 ms, hold at least 2 s, out over 200 to 400 ms. No bounce, no glow, no typewriter.','入场 250 至 600 毫秒，停留至少 2 秒，出场 200 至 400 毫秒。不弹跳、不发光、不用打字机效果。'],
  ['Countries','国家','Flags only, timed to the word. Country names are never typed on screen.','只用国旗，跟着说话时间点出现。画面上不打国家名。'],
  ['No pop-words','不用弹出关键词','The only kinetic type in the film is the title card.','片中唯一的动态文字是片名卡。'],
  ['Places','地点','Every arrival is a map leg first, then the slate caption. No top-left location tags.','每次到站先出地图段，再出场记角标字幕。不用左上角地点标签。'],
  ['Logos','标志','Use the WorldFirst SVG files as supplied. Never retype or recolour the wordmark.','使用提供的万里汇 SVG 文件，不要重新打字或改色。']].map(r=>`<div><b>${Z(r[0],r[1])}</b><span>${Z(r[2],r[3])}</span></div>`).join('')}</div></section>`;

/* ---------- 01 title ---------- */
const title=()=>`<section class="sl" id="d1"><div class="slh"><span class="no">01</span><h2>${Z('Title card: Coach window','片名卡：车窗')}</h2></div>
 <p class="dec">${Z('The title sits on the coach window while Guangzhou slides past behind the glass. It lands on the music hit right after the hook montage. The AI image is the composition reference only: build the type in After Effects with Poppins over real coach-window footage, as in the live version. The film is called Sourcing Trip.','片名贴在大巴车窗玻璃上，广州的城市在玻璃后面掠过。在开场钩子结束后的音乐重拍上出现。AI 图只作为构图参考：请在 After Effects 里用 Poppins 字体，在真实的车窗素材上制作文字，参照实时版本。片名为 Sourcing Trip。')}</p>
 <div class="grid"><div class="stk">
  <div>${stageLbl('Live build on trip footage','真实素材上的实时版本',1)}<div class="stage tCW" data-t><div class="ph"></div><div class="tint"></div><div class="tt"><h5>Sourcing<br/>Trip</h5><p>Guangdong, October 2026</p></div><img class="lg" src="wf/wf_logo_en_hrz_rev.svg" alt=""/></div></div>
  <div>${stageLbl('Composition reference (AI)','构图参考（AI 生成）')}<img class="ref" src="higgsfield/title_2.jpg" alt=""/></div>
 </div><div>${rows([
  R('Title','片名','Poppins ExtraBold','112 px','800','LH 0.94 · −1%',col(W,'94%'),'Uppercase, two lines: SOURCING / TRIP. Left edge 192 px (10%), top of first line at 34% of height.','全大写，两行：SOURCING / TRIP。左边距 192 px（10%），第一行顶部在画面高度 34% 处。'),
  R('Subtitle','副标题','Poppins SemiBold','30 px','600','LH 1.3 · 0',col(W),'Guangdong, October 2026. 22 px below the title, same left edge.','Guangdong, October 2026。在片名下方 22 px，左对齐。'),
  R('Glass tint','玻璃暗部','—','—','—','—',col('#13002D','45% → 0'),'Left-to-right gradient over the full frame, fading out at 60% of the width. Keeps white type readable on bright sky.','从左到右的渐变，覆盖全画面，到画面宽度 60% 处消失。让白字在亮天空上也清楚。'),
  R('Logo','标志','SVG','36 px tall','—','—',col(W),'WorldFirst reverse lockup file. Right 77 px, bottom 72 px.','万里汇反白标志文件。距右 77 px，距底 72 px。'),
  {g:['Motion','动效']},
  R('Plate','背景','—','—','—','—','—','Real coach-window footage with the city moving (Day 1, Guangzhou to Shunde). No zoom.','真实车窗素材，城市在后面移动（第一天，广州到顺德）。不推拉镜头。'),
  R('In','入场','—','—','—','—','—','Title at 0.4 s: 600 ms fade with focus from 12 px blur to sharp. Subtitle at 0.9 s: 400 ms, rises 12 px. Logo at 1.2 s: 400 ms fade.','片名 0.4 秒入场：600 毫秒淡入，同时从 12 px 模糊对焦到清晰。副标题 0.9 秒入场：400 毫秒，上移 12 px。标志 1.2 秒入场：400 毫秒淡入。'),
  R('Hold and out','停留与出场','—','—','—','—','—','Hold 3 s. Everything out together in 400 ms fade, then cut to Joshua at the coach.','停留 3 秒。所有元素一起 400 毫秒淡出，然后切到大巴旁的 Joshua。')])}
  <div class="note">${Z('The lettering in the AI reference is blurred on purpose: use it for the composition only, not for the words or the font.','AI 参考图里的文字已刻意模糊：只参考构图，不参考文字内容和字体。')}</div></div></div></section>`;

/* ---------- 02 captions ---------- */
const CAPS=[
 ['joshua_bus',`<div class="el"><i class="br"></i><div class="fls">${FL5.map(c=>fl(c)).join('')}</div><span>14 importers · five countries</span><small>12.10.2026 · Guangzhou</small></div>`],
 ['han',`<div class="el"><i class="br"></i><b>Han ${fl('au')}</b><span>Amazon growth consultant</span><small>12.10.2026 · Guangzhou</small></div>`],
 ['tower',`<div class="el"><i class="br"></i><b>Rongde</b><span>Kettles and lunch boxes · Zhongshan</span><small>13.10.2026 · Day 2</small></div>`],
 ['container',`<div class="el"><i class="br"></i><b class="x">20</b><span>containers a day · Weijin</span><small>13.10.2026 · Zhongshan</small></div>`]];
const caps=()=>`<section class="sl" id="d2"><div class="slh"><span class="no">02</span><h2>${Z('Caption system: Slate corner','字幕系统：场记角标')}</h2></div>
 <p class="dec">${Z('One caption style for countries, names, places and numbers, start to end. A thin white corner bracket, the main line, a detail line, and a red date-and-place line like a documentary slate. The live version cycles through all four uses. Countries are flags, never typed, so the reference\'s "Australia" becomes a flag.','国家、人名、地点、数字全片只用一种字幕样式：一个细白角框、主信息、说明，再加一行像纪录片场记一样的红色日期地点。左侧实时版本依次演示四种用法。国家只用国旗，不打字，所以参考图里的 "Australia" 改成国旗。')}</p>
 <div class="grid"><div class="stk">
  <div>${stageLbl('Live build: countries, name, place, number','实时版本：国家、人名、地点、数字',1)}<div class="stage cy B6">${CAPS.map((c,j)=>`<div class="sc ${j?'':'on'}" style="background-image:url(frames/${c[0]}.jpg)" data-d="3000"><div class="scrim"></div>${c[1]}</div>`).join('')}</div></div>
  <div>${stageLbl('Look reference (AI)','样式参考（AI 生成）')}<img class="ref" src="higgsfield/caps_5.jpg" alt=""/></div>
 </div><div>${rows([
  R('Corner bracket','角框','—','top arm 44 px','2 px line','—',col(W),'Top arm 44 px; left arm runs the full height of the block.','上边 44 px；左边与整组文字等高。'),
  R('Main line','主信息','Poppins Bold','69 px','700','LH 1.1 · −0.5%',col(W),'Name or place. Flag after a name: 56 px circle, 2 px white ring, 12 px gap.','人名或地点。人名后接国旗：56 px 圆形，2 px 白边，间距 12 px。'),
  R('Number','数字','Poppins ExtraBold','125 px','800','LH 1.0 · −2%',col(W),'Takes the place of the main line for figures.','数字类信息用它替代主信息行。'),
  R('Detail line','说明','Poppins Regular','35 px','400','LH 1.35 · 0',col(W,'90%'),'Role, product or what the number means. 8 px below the main line.','身份、产品或数字含义。在主信息下方 8 px。'),
  R('Slate line','日期地点','Poppins SemiBold','22 px','600','+14% · uppercase',col(RED),'DD.MM.YYYY · PLACE or DAY n. 15 px below the detail line.','格式：日.月.年 · 地点 或 DAY n。在说明下方 15 px。','+14% · 大写'),
  R('Flags row','国旗行','—','56 px','—','gap 13 px',col(W,'ring 2 px'),'Replaces the main line when the countries are the point (Joshua\'s open).','当重点是国家时（Joshua 开场）替代主信息行。'),
  R('Block','位置','—','—','—','—','—','Left 96 px, bottom 96 px. Text starts 33 px right of the bracket and 27 px below its top.','距左 96 px，距底 96 px。文字距角框左边 33 px，距角框顶部 27 px。'),
  R('Scrim','底部暗部','—','bottom 40%','—','—',col('#13002D','55% → 0'),'Only while a caption is on screen.','只在字幕出现时加。'),
  {g:['Motion','动效']},
  R('In','入场','—','—','—','—','—','Bracket draws in 250 ms, then the lines rise 12 px and fade in over 350 ms, 80 ms apart.','角框 250 毫秒画出，然后各行文字上移 12 px 并淡入，350 毫秒，每行间隔 80 毫秒。'),
  R('Hold and out','停留与出场','—','—','—','—','—','Hold at least 2 s. Out: 200 ms fade, all lines together.','至少停留 2 秒。出场：200 毫秒一起淡出。')])}</div></div></section>`;

/* ---------- 03 subtitles ---------- */
const SUBS=[
 {bg:'han',en:"Until you're here, you're not really realising the scale of things.",zh:'不亲自来一趟，你很难真正体会到这里的规模。'},
 {bg:'korean',en:'From Korea to the Chinese factory: convenient, and fast.',zh:'从韩国转到中国工厂，很方便，也很快。'},
 {bg:'jeff',en:'So our main business is focusing on the water purifier.',zh:'我们的主营业务是净水器。'}];
const subs=()=>`<section class="sl" id="d3"><div class="slh"><span class="no">03</span><h2>${Z('Subtitles: Purple box','对白字幕：紫底块')}</h2></div>

/* ---------- 04 atlas ---------- */
const atlas=()=>`<section class="sl" id="d4"><div class="slh"><span class="no">04</span><h2>${Z('Route map ground: Atlas','路线地图底图：地图册')}</h2></div>
 <p class="dec">${Z('A printed-atlas look on real geography: white land, grey water, OpenStreetMap motorways as fine black hairlines, a coordinate grid at the edges, and the red route as the only colour. Used for the full-trip map right after Joshua boards.','基于真实地理的印刷地图册风格：白色陆地、灰色水面，OpenStreetMap 高速公路是细黑线，边缘有经纬网格，红色路线是唯一的颜色。用于 Joshua 上车后的全程路线地图。')}</p>
 <div class="grid"><div class="stk one"><div>${stageLbl('Live map','实时地图',1)}<div class="stage"><canvas data-map="look:atlas"></canvas><div class="attr dk">Map data © OpenStreetMap contributors</div></div></div></div>

  R('Scale bar','比例尺','Poppins Medium','17 px','500','0',col(INK),'4 px bar for 10 km, bottom right.','右下角，4 px 粗，代表 10 km。'),
  R('Map credit','地图版权','Poppins Regular','14 px','400','0',col(INK,'55%'),'Map data © OpenStreetMap contributors. Required, bottom right.','Map data © OpenStreetMap contributors。必须保留，右下角。'),
  {g:['Camera','镜头']},
  R('Move','运动','—','—','—','—','—','Frames Guangzhou to Zhongshan; slow 5% push over the shot.','框住广州到中山；整段缓慢推进 5%。')])}</div></div></section>`;

/* ---------- 05 motion ---------- */
const motion=()=>`<section class="sl" id="d5"><div class="slh"><span class="no">05</span><h2>${Z('Map motion: Photo pins, plus Day counter','地图动效：照片图钉，加天数里程')}</h2></div>
 <p class="dec">${Z('Between stops the map runs on the light ground. As the coach reaches each stop, a frame from that stop pops from the pin and shrinks to a thumbnail, so by the end the map is the film\'s index. The Day counter uses the same light style and is an extra version for the legs between days.','各站之间的地图用浅色底图。大巴每到一站，从定位点弹出那一站的画面，再缩成小图留在地图上，到最后整张地图就是影片的目录。天数里程用同样的浅色风格，作为每天之间路段的额外版本。')}</p>
 <div class="grid"><div class="stk">
  <div>${stageLbl('Photo pins','照片图钉',1)}<div class="stage"><canvas data-map="mo:photo"></canvas><div class="attr dk">Map data © OpenStreetMap contributors</div></div></div>
  <div>${stageLbl('Day counter (light)','天数里程（浅色）',1)}<div class="stage"><canvas data-map="mo:dayslight"></canvas><div class="hud hudN lt"><b data-hud="day">Day 1</b><span><em data-hud="km">0</em> km · stop <em data-hud="stop">1</em> of 11</span></div><div class="days lt">${[1,2,3,4].map(d=>`<div data-dd="${d}"><i><u></u></i>DAY ${d}</div>`).join('')}</div><div class="attr dk" style="bottom:auto;top:1.6cqw">Map data © OpenStreetMap contributors</div></div></div>
 </div><div>${rows([
  {g:['Light ground','浅色底图']},
  R('Water · land','水面 · 陆地','—','—','—','—',`${col('#ECEDEE')} · ${col(W)}`,'Same shapes as the atlas, without the grid.','与地图册形状相同，没有经纬网。'),
  R('Motorways','高速公路','—','1.4 px','—','—',col(INK,'17%'),'OSM motorways.','OSM 高速公路。'),
  R('City names','城市名','Poppins SemiBold','19 px','600','+10% · uppercase',col(INK,'45%'),'As on the atlas, lighter.','与地图册相同，颜色更浅。','+10% · 大写'),
  {g:['Photo pins','照片图钉']},
  R('Route','路线','—','6.5 px','—','round caps',col(RED),'Draws stop to stop, ease in and out.','一站一站画出，缓入缓出。','圆头'),
  R('Coach','大巴','—','65 × 27 px','—','outline 3.5 px',col(RED),'White outline and windows, faces the direction of travel.','白色描边和车窗，车头朝行驶方向。','描边 3.5 px'),
  R('Photo card','照片卡','—','324 px','—','frame 15 px',col(W),'Square, 30% of frame height, radius 12 px, frame from that stop. Name strip 55 px tall.','正方形，画面高度 30%，圆角 12 px，放该站画面。下方名称条高 55 px。','边框 15 px'),
  R('Card name','卡片站名','Poppins SemiBold','24 px','600','0',col(INK),'Left-aligned in the name strip.','在名称条里左对齐。'),
  R('Leader line','引线','—','2.3 px','—','—',col(INK,'50%'),'From the pin to the card.','从站点连到照片卡。'),
  R('Thumbnail','缩略图','—','162 px','—','frame 7 px',col(W),'15% of height; stays on the map after the card shrinks.','画面高度 15%；照片卡缩小后留在地图上。','边框 7 px'),
  R('Motion','动效','—','—','—','—','—','Card pops in 300 ms to 106%, settles in 120 ms, holds 700 ms, shrinks to the thumbnail in 400 ms. The next leg starts as it shrinks.','照片卡 300 毫秒弹出到 106%，120 毫秒回到 100%，停留 700 毫秒，400 毫秒缩成缩略图。缩小时下一段路线开始。'),
  {g:['Day counter (light)','天数里程（浅色）']},
  R('Day','天数','Poppins ExtraBold','81 px','800','−3.5%',col(INK),'Top-left, 69 px in, 65 px down.','左上角，距左 69 px，距上 65 px。'),
  R('Counter line','计数行','Poppins Medium','25 px','500','tabular figures',col('#484F56'),'Format: 64 km · stop 4 of 11, 12 px under the day.','格式：64 km · stop 4 of 11，在天数下方 12 px。','等宽数字'),
  R('Counter numbers','计数数字','Poppins Bold','42 px','700','tabular figures',col(INK),'Count up live as the coach moves.','随大巴移动实时增加。','等宽数字'),
  R('Day strip','天数进度条','—','9 px bars','—','gap 13 px',col(RED),'Four equal segments, track #1F2323 12%, radius 6 px, 69 px from the bottom and sides.','四段等宽，底色 #1F2323 12%，圆角 6 px，距底部和两侧 69 px。','间距 13 px'),
  R('Strip labels','进度条标签','Poppins SemiBold','19 px','600','+8% · uppercase',col(INK),'DAY 1 to DAY 4 under the bars; days not current at 45%.','DAY 1 到 DAY 4 放在进度条下方；非当前天为 45%。','+8% · 大写'),
  R('Route by day','按天的路线','—','7.7 / 4.6 px','—','—',`${col(RED)} / ${col(INK,'35%')}`,'Today\'s route in red; earlier days in grey.','当天路线红色；之前几天灰色。')])}</div></div></section>`;

function render(){
  document.documentElement.lang=LANG==='zh'?'zh':'en';document.body.dataset.lang=LANG;
  document.getElementById('bLangD').textContent=LANG==='zh'?'English':'中文';
  const names=[Z('Cover','封面'),Z('Title','片名'),Z('Captions','字幕'),Z('Subtitles','对白'),Z('Map ground','底图'),Z('Map motion','动效')];
  document.getElementById('dnav').innerHTML=names.map((n,i)=>`<a href="#d${i}" data-i="${i}">${String(i).padStart(2,'0')} ${n}</a>`).join('');
  document.getElementById('deck').innerHTML=cover()+title()+caps()+subs()+atlas()+motion();
  initStages();
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&!e.target._seen){e.target._seen=1;go(e.target)}}),{threshold:.4});
  document.querySelectorAll('.tCW').forEach(s=>io.observe(s));
  const so=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const i=e.target.id.slice(1);document.querySelectorAll('#dnav a').forEach(a=>a.classList.toggle('on',a.dataset.i===i))}}),{threshold:.3});
  document.querySelectorAll('section.sl').forEach(s=>so.observe(s));
}
function go(st){st.classList.remove('go');void st.offsetWidth;st.classList.add('go')}
document.addEventListener('click',e=>{const t=e.target;
  if(t.id==='bLangD'){LANG=LANG==='zh'?'en':'zh';try{localStorage.setItem(LK,LANG)}catch(x){}render()}
  else if(t.hasAttribute('data-rp')){const st=t.closest('div').parentElement.querySelector('.stage')||t.closest('.lbl').nextElementSibling;if(!st)return;if(st.classList.contains('cy'))CYC.get(st).start();else if(st._map)st._map.restart();else go(st)}});
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;const ss=[...document.querySelectorAll('section.sl')];const y=window.scrollY+90;let i=ss.findIndex(s=>s.offsetTop+s.offsetHeight>y);if(i<0)i=0;
  if(['ArrowDown','ArrowRight','PageDown'].includes(e.key)){e.preventDefault();(ss[i+1]||ss[i]).scrollIntoView()}else if(['ArrowUp','ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();(ss[i-1]||ss[0]).scrollIntoView()}});
render();
})();
</script>
